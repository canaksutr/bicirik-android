name: Bicirik APK Olustur

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    name: Android APK Derle
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Projeyi al
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Android 35 paketlerini kur
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9 kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: APK derle
        run: gradle :app:assembleDebug --no-daemon

      - name: APK adını düzenle
        run: cp app/build/outputs/apk/debug/app-debug.apk bicirik-debug.apk

      - name: APK dosyasını yayınla
        uses: actions/upload-artifact@v4
        with:
          name: bicirik-apk
          path: bicirik-debug.apk
          if-no-files-found: error
          retention-days: 30

